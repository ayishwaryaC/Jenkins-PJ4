apiVersion: apps/v1
kind: Deployment

metadata:
  name: jenkins-cicd-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: jenkins-cicd-app

  template:
    metadata:
      labels:
        app: jenkins-cicd-app

    spec:
      containers:
        - name: jenkins-cicd-app
          image: ayishu/jenkins-cicd-app:latest

          ports:
            - containerPort: 80
---

apiVersion: v1
kind: Service

metadata:
  name: jenkins-cicd-service

spec:
  type: NodePort

  selector:
    app: jenkins-cicd-app

  ports:
    - port: 80
      targetPort: 80